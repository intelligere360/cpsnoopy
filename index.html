    <!-- SCRIPT PARA OCULTAR URL BAR EN ANDROID -->
    <script>
        // Prevenir que aparezca la URL bar en Android
        if ('standalone' in navigator || window.matchMedia('(display-mode: standalone)').matches) {
            // La app está en modo standalone (PWA instalada)
            document.documentElement.style.setProperty('--sat', 'env(safe-area-inset-top)');
        }    
        // Prevenir zoom con doble tap (mantener esto)
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>
    <!-- Registrar el service worker -->
    <script>
        // En index.html - registro del Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // ✅ SW AUTOCONTENIDO - NO DEPENDE DE VARIABLES EXTERNAS
                navigator.serviceWorker.register('./sw.js')
                .then(function(registration) {
                    console.log('✅ Service Worker registrado:', registration.scope);
                    // Verificar si hay una nueva versión
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        console.log('🔄 Nueva versión del Service Worker encontrada');
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('🔄 Nueva versión disponible. Recarga para actualizar.');
                                // Aquí podrías mostrar un botón para recargar
                            }
                        });
                    });
                })
                .catch(function(error) {
                    console.log('❌ Error registrando Service Worker:', error);
                });
            });
        }
    </script>
