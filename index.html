    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // ✅ CAMBIAR a sw-cpsnoopy.js con scope específico
                navigator.serviceWorker.register('./sw-cpsnoopy.js', {
                    scope: './'
                })
                .then(function(registration) {
                    console.log('✅ Service Worker CPSnoopy registrado:', registration.scope);
                    
                    // Escuchar mensajes del Service Worker
                    navigator.serviceWorker.addEventListener('message', event => {
                        if (event.data.type === 'VERSION_UPDATED') {
                            console.log('🔄 Versión actualizada recibida:', event.data.version);
                            mostrarNotificacion(`Versión ${event.data.version} instalada`, 'success');
                        }
                    });
                    
                    // Iniciar verificador de versiones
                    if (window.versionManager) {
                        window.versionManager.startPeriodicCheck(1800000);
                        
                        // Escuchar actualizaciones
                        window.versionManager.onUpdate((newVersion, oldVersion) => {
                            console.log(`🆕 Actualización: ${oldVersion} → ${newVersion}`);
                            // Opcional: Forzar recarga de productos
                            if (window.cargarProductosConPrecargaPersistente) {
                                window.cargarProductosConPrecargaPersistente(true);
                            }
                        });
                    }
                })
                .catch(function(error) {
                    console.log('❌ Error registrando Service Worker de CPSnoopy:', error);
                });
            });
        }
    </script>
    <!-- SCRIPT PARA OCULTAR URL BAR EN ANDROID -->
    <script>
        // Prevenir que aparezca la URL bar en Android
        if ('standalone' in navigator || window.matchMedia('(display-mode: standalone)').matches) {
            // La app está en modo standalone (PWA instalada)
            document.documentElement.style.setProperty('--sat', 'env(safe-area-inset-top)');
        }    
        // Prevenir zoom con doble tap (mantener esto)
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>
